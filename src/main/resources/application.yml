server:
  port: 8082
  servlet:
    context-path: /match-engine

spring:
  application:
    name: match-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/eapdb
    username: admin
    password: admin123
    hikari:
      connection-timeout: ${EAP_DB_CONNECTION_TIMEOUT_MS:2000}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: dev
    drop-first: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 60000

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

eap:
  recovery-source:
    enabled: ${EAP_RECOVERY_SOURCE_ENABLED:false}
    token: ${EAP_RECOVERY_SOURCE_TOKEN:}
  match-engine:
    listeners:
      asset-reservation-succeeded:
        concurrency: 8
    order-admission-inbox:
      enabled: true
      admin-enabled: false
      worker-concurrency: ${EAP_MATCH_ADMISSION_WORKER_CONCURRENCY:16}
      batch-size: 100
      poll-interval-ms: 100
      initial-delay-ms: 500
      lease-ms: 30000
      max-attempts: 20
      initial-backoff-ms: 250
      max-backoff-ms: 30000
    orderbook-runtime:
      admin-enabled: false
      monitor-interval-ms: 250
      monitor-initial-delay-ms: 0
      max-snapshot-age-ms: 1000
    order-cancellation:
      reconcile-batch-size: 50
      reconcile-lease-ms: 30000
      max-technical-attempts: 20
      prerequisite-alert-after-attempts: 40
    trade-persistence:
      enabled: true
    trade-outbox:
      write-enabled: true
    trade-outbox-relay:
      enabled: true
      batch-size: 200
      poll-interval-ms: 500
      confirm-timeout-ms: 5000
      max-attempts: 10
      initial-backoff-ms: 1000
      max-backoff-ms: 300000
    trade-checkpoint-relay:
      enabled: false
      batch-size: 500
      poll-interval-ms: 100
      batch-confirm-enabled: false
      confirm-timeout-ms: 5000
    reservation-cleanup:
      enabled: true
      batch-size: 500
      poll-interval-ms: 100
      max-attempts: 10
      initial-backoff-ms: 1000
      max-backoff-ms: 300000
      processing-timeout-seconds: 30
      lease-renewal-chunk-size: 50
    reservation-reconciler:
      enabled: true
      batch-size: 100
      poll-interval-ms: 5000
      orphan-threshold-seconds: 30
      max-attempts: 10

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,durableDebt,matchOrderAdmissionInbox,orderBookRuntime,orderBookRuntimeManifest
  metrics:
    tags:
      application: eap-matchEngine

auction:
  enabled: true
  duration-minutes: 10
  default-price-floor: 0
  default-price-ceiling: 9999

logging:
  level:
    root: INFO
    '[com.eap]': DEBUG
