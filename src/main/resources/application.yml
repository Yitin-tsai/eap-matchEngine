server:
  port: 8082
  servlet:
    context-path: /match-engine

spring:
  application:
    name: match-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/eapdb
    username: admin
    password: admin123

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: dev
    drop-first: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 60000

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

eap:
  match-engine:
    trade-persistence:
      enabled: true
    trade-outbox-relay:
      enabled: true
      batch-size: 200
      poll-interval-ms: 500
      confirm-timeout-ms: 5000
      max-attempts: 10
      initial-backoff-ms: 1000
      max-backoff-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: eap-matchEngine

auction:
  enabled: true
  duration-minutes: 10
  default-price-floor: 0
  default-price-ceiling: 9999

logging:
  level:
    root: INFO
    '[com.eap]': DEBUG
