spring:
  datasource:
    url: jdbc:postgresql://localhost:15434/eap_match_db
    username: admin
    password: admin123
    hikari:
      maximum-pool-size: 35
      minimum-idle: 10
  rabbitmq:
    cache:
      channel:
        size: 128
    listener:
      simple:
        concurrency: 8
        max-concurrency: 32
        prefetch: 50

eap:
  match-engine:
    listeners:
      order-confirmed:
        concurrency: 12
      order-trade-applied:
        concurrency: 12
      wallet-trade-settled:
        concurrency: 6
      completion-marker:
        batch-size: 50
        receive-timeout-ms: 25
    trade-outbox-relay:
      enabled: ${EAP_MATCH_TRADE_OUTBOX_RELAY_ENABLED:true}
      batch-size: ${EAP_MATCH_TRADE_OUTBOX_BATCH_SIZE:500}
      publish-concurrency: 4
      batch-confirm-enabled: ${EAP_MATCH_TRADE_OUTBOX_BATCH_CONFIRM_ENABLED:false}
      poll-interval-ms: 100
    trade-outbox:
      write-enabled: ${EAP_MATCH_TRADE_OUTBOX_WRITE_ENABLED:true}
    trade-checkpoint-relay:
      enabled: ${EAP_MATCH_TRADE_CHECKPOINT_RELAY_ENABLED:false}
      batch-size: ${EAP_MATCH_TRADE_CHECKPOINT_RELAY_BATCH_SIZE:500}
      batch-confirm-enabled: ${EAP_MATCH_TRADE_CHECKPOINT_RELAY_BATCH_CONFIRM_ENABLED:false}
      poll-interval-ms: 100
    trade-completion-view:
      hot-path-enabled: false
    orderbook:
      user-open-order-index-enabled: ${EAP_MATCH_USER_OPEN_ORDER_INDEX_ENABLED:true}
    trade-completion-reconciler:
      enabled: false
      batch-size: 500
      poll-interval-ms: 1000
      delayed-threshold-seconds: 30
    reservation-reconciler:
      enabled: false
      batch-size: 500
      poll-interval-ms: 1000
      orphan-threshold-seconds: 30
    reservation-cleanup:
      enabled: true
      batch-size: ${EAP_MATCH_RESERVATION_CLEANUP_BATCH_SIZE:1000}
      poll-interval-ms: ${EAP_MATCH_RESERVATION_CLEANUP_POLL_INTERVAL_MS:25}
      max-attempts: 10
      initial-backoff-ms: 100
      max-backoff-ms: 30000
      processing-timeout-seconds: 10

logging:
  level:
    '[com.eap.eap_matchengine]': WARN
    '[org.springframework.amqp.rabbit.listener]': WARN
    '[org.hibernate]': WARN
