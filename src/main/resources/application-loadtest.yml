spring:
  datasource:
    url: jdbc:postgresql://localhost:15434/eap_match_db
    username: admin
    password: admin123
    hikari:
      maximum-pool-size: ${EAP_MATCH_DB_POOL_SIZE:35}
      minimum-idle: ${EAP_MATCH_DB_POOL_MIN_IDLE:10}
  rabbitmq:
    cache:
      channel:
        size: 128
    listener:
      simple:
        concurrency: ${EAP_MATCH_RABBIT_CONCURRENCY:8}
        max-concurrency: ${EAP_MATCH_RABBIT_MAX_CONCURRENCY:32}
        prefetch: ${EAP_MATCH_RABBIT_PREFETCH:50}
  data:
    redis:
      lettuce:
        pool:
          enabled: ${EAP_REDIS_LETTUCE_POOL_ENABLED:false}
          max-active: ${EAP_REDIS_LETTUCE_POOL_MAX_ACTIVE:64}
          max-idle: ${EAP_REDIS_LETTUCE_POOL_MAX_IDLE:64}
          min-idle: ${EAP_REDIS_LETTUCE_POOL_MIN_IDLE:16}
          max-wait: ${EAP_REDIS_LETTUCE_POOL_MAX_WAIT:500ms}

eap:
  redis:
    share-native-connection: ${EAP_REDIS_SHARE_NATIVE_CONNECTION:true}
  match-engine:
    listeners:
      order-confirmed:
        concurrency: ${EAP_MATCH_ORDER_CONFIRMED_CONCURRENCY:12}
    trade-outbox-relay:
      enabled: ${EAP_MATCH_TRADE_OUTBOX_RELAY_ENABLED:true}
      batch-size: ${EAP_MATCH_TRADE_OUTBOX_BATCH_SIZE:500}
      publish-concurrency: ${EAP_MATCH_TRADE_OUTBOX_PUBLISH_CONCURRENCY:4}
      batch-confirm-enabled: ${EAP_MATCH_TRADE_OUTBOX_BATCH_CONFIRM_ENABLED:false}
      poll-interval-ms: ${EAP_MATCH_TRADE_OUTBOX_POLL_INTERVAL_MS:100}
    trade-outbox:
      write-enabled: ${EAP_MATCH_TRADE_OUTBOX_WRITE_ENABLED:true}
    trade-checkpoint-relay:
      enabled: ${EAP_MATCH_TRADE_CHECKPOINT_RELAY_ENABLED:false}
      batch-size: ${EAP_MATCH_TRADE_CHECKPOINT_RELAY_BATCH_SIZE:500}
      batch-confirm-enabled: ${EAP_MATCH_TRADE_CHECKPOINT_RELAY_BATCH_CONFIRM_ENABLED:false}
      poll-interval-ms: 100
    orderbook:
      user-open-order-index-enabled: ${EAP_MATCH_USER_OPEN_ORDER_INDEX_ENABLED:true}
    reservation-reconciler:
      enabled: ${EAP_MATCH_RESERVATION_RECONCILER_ENABLED:true}
      batch-size: ${EAP_MATCH_RESERVATION_RECONCILER_BATCH_SIZE:500}
      poll-interval-ms: ${EAP_MATCH_RESERVATION_RECONCILER_POLL_INTERVAL_MS:1000}
      orphan-threshold-seconds: 30
    reservation-cleanup:
      enabled: true
      batch-size: ${EAP_MATCH_RESERVATION_CLEANUP_BATCH_SIZE:1000}
      poll-interval-ms: ${EAP_MATCH_RESERVATION_CLEANUP_POLL_INTERVAL_MS:25}
      max-attempts: 10
      initial-backoff-ms: ${EAP_MATCH_RESERVATION_CLEANUP_INITIAL_BACKOFF_MS:100}
      max-backoff-ms: ${EAP_MATCH_RESERVATION_CLEANUP_MAX_BACKOFF_MS:30000}
      processing-timeout-seconds: ${EAP_MATCH_RESERVATION_CLEANUP_PROCESSING_TIMEOUT_SECONDS:10}
      lease-renewal-chunk-size: ${EAP_MATCH_RESERVATION_CLEANUP_LEASE_CHUNK_SIZE:50}

logging:
  level:
    '[com.eap.eap_matchengine]': WARN
    '[org.springframework.amqp.rabbit.listener]': WARN
    '[org.hibernate]': WARN
