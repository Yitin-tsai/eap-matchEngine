plugins {
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springframework.cloud.contract' version '4.3.0'
    id 'java'
}

group = 'com.eap'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.1"
    }
}

dependencies {
    implementation 'com.eap:eap-common:1.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.redisson:redisson-spring-boot-starter:3.37.0'
    implementation 'org.apache.commons:commons-pool2'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:rabbitmq'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier'
}

tasks.named("generateContractTests") {
    contractsDslDir = file("src/contractTest/resources/contracts")
    basePackageForTests.set("com.eap.eap_matchengine")
    baseClassForTests.set("com.eap.eap_matchengine.BaseContractTest")
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'eap.integration.crash-recovery',
            System.getProperty('eap.integration.crash-recovery', 'false')
}

tasks.register('crashRecoveryIntegrationTest', Test) {
    group = 'verification'
    description = 'Run PostgreSQL/Redis MatchEngine crash-window recovery integration tests.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'eap.integration.crash-recovery', 'true'
    // Docker Engine 29 rejects the legacy API version used during docker-java discovery.
    systemProperty 'api.version', System.getProperty('api.version', '1.40')
    include '**/*CrashRecoveryPostgresRedisIT.class'
    shouldRunAfter tasks.named('test')
}

tasks.register('matchEngineCoreLoadTest', JavaExec) {
    group = 'verification'
    description = 'Benchmark and verify the Redis/Lua CDA matching core without Order/Wallet/DB overhead.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_matchengine.loadtest.MatchEngineCoreLoadGenerator'
}

tasks.register('matchDbCeilingProbe', JavaExec) {
    group = 'verification'
    description = 'Measure MatchEngine PostgreSQL durable write ceiling without Redis, RabbitMQ, or Spring listeners.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_matchengine.loadtest.MatchDbCeilingProbe'
}

tasks.register('outboxRelayCeilingProbe', JavaExec) {
    group = 'verification'
    description = 'Measure isolated Match/Order/Wallet outbox relay select, RabbitMQ confirm, and mark-SENT ceiling.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_matchengine.loadtest.OutboxRelayCeilingProbe'
}
